# Путь к папке с артефактами модуля gosts:
#   gosts.yaml  — словарь
#   index.md / toc.yaml / index.yaml — генерируемый индекс
# Путь относительный, от docs/<lang>/.
# Ключ — код языка; он же подставляется в URL: /<lang>/<path>/
#
# Чтобы добавить язык, допиши строку, например:
#   de: Дополнительнаяинформация/Терминыиопределения
ru: Дополнительнаяинформация/ГОСТы
en: Additional information/Standards