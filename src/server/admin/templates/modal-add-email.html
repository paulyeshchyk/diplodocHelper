<div class="modal">
  <h2>Добавить email</h2>
  <label>Email</label>
  <input type="email" id="m-email" placeholder="user@company.ru" autocomplete="off">
  <label>Примечание (кто это)</label>
  <input type="text" id="m-note" placeholder="Иванов, ОИТ" autocomplete="off" maxlength="200">
  <div class="modal-actions">
    <button type="button" id="m-cancel">Отмена</button>
    <button type="button" id="m-add" class="primary">Добавить</button>
  </div>
  <div id="m-result"></div>
</div>
