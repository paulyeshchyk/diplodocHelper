# Путь к папке с артефактами модуля abbrs:
#   abbreviations.yaml  — словарь
#   index.md / toc.yaml / index.yaml — генерируемый индекс
# Путь относительный, от docs/<lang>/.
# Ключ — код языка; он же подставляется в URL: /<lang>/<path>/
#
# Чтобы добавить язык, допиши строку, например:
#   de: Дополнительнаяинформация/Списоксокращений
ru: Дополнительнаяинформация/Списоксокращений
en: Additional information/List of abbreviations